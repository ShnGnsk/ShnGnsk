<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" font-family="Arial, sans-serif">
  <!-- Olcek: 1 cm = 1.2 px | W=300cm=360px | D=320cm=384px | origin ic kose (80,50) -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#666" stroke-width="1"/>
    </pattern>
    <pattern id="rug" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f2f2f2"/>
      <path d="M0 0 L12 12 M12 0 L0 12" stroke="#111" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a1f1f"/>
    </marker>
  </defs>

  <!-- Oda kutusu -->
  <line x1="80" y1="50" x2="80" y2="434" stroke="#111" stroke-width="3"/>
  <line x1="440" y1="50" x2="440" y2="434" stroke="#111" stroke-width="3"/>

  <!-- ===== UST: 2 | Salon80 | 5 | Kiris40 saga | bos ===== -->
  <line x1="80" y1="50" x2="82.4" y2="50" stroke="#111" stroke-width="5"/>
  <text x="81" y="38" text-anchor="middle" font-size="11" fill="#8a1f1f" font-weight="700">2</text>

  <rect x="82.4" y="45" width="96" height="12" fill="url(#hatch)" stroke="#111"/>
  <text x="130" y="38" text-anchor="middle" font-size="12" font-weight="700">Salon Kapisi</text>
  <path d="M82.4 57 A48 48 0 0 0 130 105" fill="none" stroke="#888" stroke-dasharray="3 2"/>

  <line x1="178.4" y1="50" x2="184.4" y2="50" stroke="#111" stroke-width="5"/>
  <line x1="178.4" y1="22" x2="184.4" y2="22" stroke="#8a1f1f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="181.4" y="16" text-anchor="middle" font-size="11" fill="#8a1f1f" font-weight="700">5cm</text>

  <!-- KIRIS: saga 40cm, ice 10cm -->
  <rect x="184.4" y="50" width="48" height="12" fill="#111" stroke="#000" stroke-width="1"/>
  <line x1="184.4" y1="78" x2="232.4" y2="78" stroke="#8a1f1f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="94" text-anchor="middle" font-size="11" fill="#8a1f1f" font-weight="700">Kiris SAGA 40cm</text>
  <text x="208" y="108" text-anchor="middle" font-size="10" fill="#333">ice 10cm</text>

  <line x1="232.4" y1="50" x2="440" y2="50" stroke="#111" stroke-width="3"/>
  <text x="336" y="38" text-anchor="middle" font-size="10" fill="#555">duvar boslugu</text>

  <!-- ===== ALT: 2 | Balkon80 | bos ===== -->
  <line x1="80" y1="434" x2="82.4" y2="434" stroke="#111" stroke-width="5"/>
  <text x="81" y="458" text-anchor="middle" font-size="11" fill="#8a1f1f" font-weight="700">2</text>
  <rect x="82.4" y="429" width="96" height="12" fill="url(#hatch)" stroke="#111"/>
  <text x="130" y="468" text-anchor="middle" font-size="12" font-weight="700">Balkon Kapisi</text>
  <path d="M178.4 434 A48 48 0 0 0 130 386" fill="none" stroke="#888" stroke-dasharray="3 2"/>
  <line x1="178.4" y1="434" x2="440" y2="434" stroke="#111" stroke-width="3"/>

  <!-- ===== SAG: Cam TAM ORTA ===== -->
  <line x1="440" y1="50" x2="440" y2="194" stroke="#111" stroke-width="3"/>
  <rect x="434" y="194" width="12" height="96" fill="url(#hatch)" stroke="#111"/>
  <rect x="416" y="206" width="18" height="72" fill="#c8c8c8" stroke="#111"/>
  <line x1="440" y1="290" x2="440" y2="434" stroke="#111" stroke-width="3"/>

  <line x1="448" y1="50" x2="448" y2="194" stroke="#8a1f1f" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="448" y1="290" x2="448" y2="434" stroke="#8a1f1f" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="470" y="122" font-size="10" fill="#8a1f1f" font-weight="700">120*</text>
  <text x="458" y="242" font-size="12" font-weight="700">Cam</text>
  <text x="458" y="256" font-size="11" fill="#8a1f1f" font-weight="700">ORTA</text>
  <text x="458" y="270" font-size="9">Petek</text>
  <text x="470" y="362" font-size="10" fill="#8a1f1f" font-weight="700">120*</text>

  <!-- ===== HALI merkez ===== -->
  <rect x="180" y="180" width="144" height="120" fill="url(#rug)" stroke="#111" stroke-width="1"/>
  <text x="252" y="245" text-anchor="middle" font-size="9" fill="#333">Hali 120x160</text>

  <!-- ===== MOBILYA BJK OYUNCU ===== -->
  <!-- Sol: BESTA TV+kitaplik 120x42 -->
  <rect x="80" y="170" width="50.4" height="144" fill="#1a1a1a" stroke="#000"/>
  <text x="105" y="248" text-anchor="middle" font-size="8" fill="#fff" transform="rotate(-90 105 248)">BESTA TV 120x42</text>
  <!-- Saat isareti sol duvar -->
  <circle cx="95" cy="155" r="10" fill="#fff" stroke="#8a1f1f" stroke-width="2"/>
  <text x="95" y="158" text-anchor="middle" font-size="7" fill="#8a1f1f" font-weight="700">BJK</text>

  <!-- Sag: xDrive Ruzgar 100x60 petek ALTINDA ? derinlik 60cm=72px -->
  <rect x="368" y="302" width="72" height="120" fill="#111" stroke="#8a1f1f" stroke-width="1.5"/>
  <text x="404" y="365" text-anchor="middle" font-size="8" fill="#fff" transform="rotate(-90 404 365)">xDrive 100x60</text>
  <!-- PC kule masa uzeri -->
  <rect x="378" y="318" width="14" height="28" fill="#333" stroke="#000"/>

  <!-- Oyuncu koltugu -->
  <circle cx="340" cy="360" r="18" fill="#222" stroke="#8a1f1f" stroke-width="1.5"/>
  <text x="340" y="364" text-anchor="middle" font-size="6" fill="#fff">KOLTUK</text>

  <!-- Oturma balkon sagi max 140 -->
  <rect x="200" y="338" width="168" height="96" fill="#222" stroke="#000"/>
  <text x="284" y="380" text-anchor="middle" font-size="9" fill="#fff">Koltuk max 140</text>
  <text x="284" y="394" text-anchor="middle" font-size="8" fill="#ccc">BJK yastik</text>

  <text x="260" y="500" text-anchor="middle" font-size="12" font-weight="700">1903 BJK Oyuncu Odasi ? cizim kilitli</text>
  <text x="260" y="518" text-anchor="middle" font-size="10" fill="#555">2cm kap? | 5cm | kiris 40x10 saga | cam ORTA | egik duvar YOK</text>
  <text x="260" y="536" text-anchor="middle" font-size="10" fill="#8a1f1f">Olcek 1.2px=1cm | W=300* D=320* | masa petek ALTI ? bant ?110</text>
  <text x="260" y="554" text-anchor="middle" font-size="9" fill="#333">TR urun: xDrive masa/sandalye ? BESTA TV ? BJK saat/aksesuar</text>
</svg>
